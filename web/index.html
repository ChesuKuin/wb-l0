<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Поиск заказа</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    max-width: 700px;
    margin: 60px auto;
    padding: 0 20px;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 22px; }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input {
    flex: 1;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 10px 18px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #result {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 16px;
    font-family: Consolas, monospace;
    font-size: 13px;
    min-height: 40px;
  }
  .error { color: #c0392b; }
  .section { margin-bottom: 10px; }
  .label { font-weight: 600; color: #444; }
  .item-line { margin-left: 12px; }
</style>
</head>
<body>

<h1>Поиск заказа по order_uid</h1>

<div class="search-box">
  <input id="orderId" type="text" placeholder="Введите order_uid, например b563feb7b2b84b6test">
  <button id="searchBtn">Найти</button>
</div>

<div id="result">Введите ID заказа и нажмите «Найти»</div>

<script>
const resultEl = document.getElementById('result');
const inputEl = document.getElementById('orderId');

function clearResult() {
  while (resultEl.firstChild) resultEl.removeChild(resultEl.firstChild);
}

function showError(message) {
  clearResult();
  const span = document.createElement('span');
  span.className = 'error';
  span.textContent = message; // textContent — не HTML, безопасно для любых данных
  resultEl.appendChild(span);
}

function showText(message) {
  clearResult();
  resultEl.textContent = message;
}

// Создаёт <div class="section"><span class="label">label:</span> value</div>
// Все значения вставляются через textContent — HTML/скрипты в данных заказа
// не исполняются, а просто отображаются как текст.
function section(label, value) {
  const div = document.createElement('div');
  div.className = 'section';

  const labelSpan = document.createElement('span');
  labelSpan.className = 'label';
  labelSpan.textContent = label + ':';

  div.appendChild(labelSpan);
  div.appendChild(document.createTextNode(' ' + value));
  return div;
}

function renderOrder(o) {
  clearResult();

  resultEl.appendChild(section('Order UID', o.order_uid ?? ''));
  resultEl.appendChild(section('Трек-номер', o.track_number ?? ''));
  resultEl.appendChild(section('Клиент', o.customer_id ?? ''));
  resultEl.appendChild(section('Дата создания', o.date_created ?? ''));

  if (o.delivery) {
    const d = o.delivery;
    const text = `${d.name ?? ''}, ${d.city ?? ''}, ${d.address ?? ''} — тел: ${d.phone ?? ''}, email: ${d.email ?? ''}`;
    resultEl.appendChild(section('Доставка', text));
  } else {
    resultEl.appendChild(section('Доставка', 'нет данных'));
  }

  if (o.payment) {
    const p = o.payment;
    const text = `${p.amount ?? ''} ${p.currency ?? ''}, провайдер: ${p.provider ?? ''}, банк: ${p.bank ?? ''}`;
    resultEl.appendChild(section('Оплата', text));
  } else {
    resultEl.appendChild(section('Оплата', 'нет данных'));
  }

  const itemsHeader = document.createElement('div');
  itemsHeader.className = 'section';
  const itemsLabel = document.createElement('span');
  itemsLabel.className = 'label';
  itemsLabel.textContent = 'Товары:';
  itemsHeader.appendChild(itemsLabel);
  resultEl.appendChild(itemsHeader);

  const items = o.items || [];
  if (items.length === 0) {
    const line = document.createElement('div');
    line.className = 'item-line';
    line.textContent = 'нет товаров';
    resultEl.appendChild(line);
  } else {
    for (const it of items) {
      const line = document.createElement('div');
      line.className = 'item-line';
      line.textContent = `• ${it.name ?? ''} — ${it.brand ?? ''}, цена: ${it.total_price ?? ''} (скидка ${it.sale ?? 0}%)`;
      resultEl.appendChild(line);
    }
  }
}

async function searchOrder() {
  const id = inputEl.value.trim();

  if (!id) {
    showError('Введите ID заказа');
    return;
  }

  showText('Загрузка...');

  try {
    const res = await fetch('/order/' + encodeURIComponent(id));
    if (!res.ok) {
      let message = 'Заказ не найден';
      try {
        const err = await res.json();
        if (err && err.error) message = err.error;
      } catch (_) {
        // тело ответа не JSON — оставляем сообщение по умолчанию
      }
      showError(message);
      return;
    }
    const order = await res.json();
    renderOrder(order);
  } catch (e) {
    showError('Ошибка запроса: ' + e.message);
  }
}

document.getElementById('searchBtn').addEventListener('click', searchOrder);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchOrder();
});
</script>

</body>
</html>
